<a href="{% url 'main:show_main' %}"
class="{% if request.resolver_match.url_name == 'show_main' %}text-primary{% else %}hover:text-primary{% endif %}">/profile</a>
<a href="{% url 'main:show_experience' %}"
class="{% if request.resolver_match.url_name == 'show_experience' %}text-primary{% else %}hover:text-primary{% endif %}">/experience</a>
<a href="{% url 'main:show_skill' %}"
class="{% if request.resolver_match.url_name == 'show_skill' %}text-primary{% else %}hover:text-primary{% endif %}">/skill</a>
<a href="{% url 'main:show_project' %}"
class="{% if request.resolver_match.url_name == 'show_project' %}text-primary{% else %}hover:text-primary{% endif %}">/project</a>
{% if user.is_authenticated %}
    <span class="nav-user hover:text-accent2 text-sm inline-flex items-center gap-1.5 whitespace-nowrap">
        <iconify-icon icon="lucide:user"></iconify-icon>
        {{ user.username }}
    </span>
    <a href="{% url 'main:logout' %}" class="hover:text-primary">/logout</a>
{% else %}
    <a href="{% url 'main:login' %}" class="hover:text-primary">/login</a>
    <a href="{% url 'main:register' %}" class="hover:text-primary">/register</a>
{% endif %}
