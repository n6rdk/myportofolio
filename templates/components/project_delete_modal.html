<div id="delete-project-{{ project.id }}"
     class="project-delete-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="delete-project-title-{{ project.id }}">
    <button type="button"
            class="project-delete-modal__backdrop"
            popovertarget="delete-project-{{ project.id }}"
            popovertargetaction="hide"
            aria-label="Close delete confirmation"></button>
    <div class="project-delete-modal__content">
        <button type="button"
                class="project-delete-modal__close"
                popovertarget="delete-project-{{ project.id }}"
                popovertargetaction="hide"
                aria-label="Close delete confirmation">×</button>
        <h2 id="delete-project-title-{{ project.id }}" class="text-danger">Delete this project?</h2>
        <p>
            Are you sure you want to delete
            <strong class="text-primary">{{ project.title }}</strong>?
        </p>
        <form method="post" action="{% url 'main:delete_project' project.id %}">
            {% csrf_token %}
            <div class="form-group mt-2">
                <input type="password"
                       name="secret_key"
                       id="secret_key_{{ project.id }}"
                       placeholder="Enter the secret code"
                       required>
            </div>
            <div class="project-delete-modal__actions">
                <button type="button"
                        class="btn2"
                        popovertarget="delete-project-{{ project.id }}"
                        popovertargetaction="hide">Cancel</button>
                <button type="submit" class="btn2 btn2-danger">Delete</button>
            </div>
        </form>
    </div>
</div>
