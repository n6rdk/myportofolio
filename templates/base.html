{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
    {% block meta %} {% endblock meta %}
</head>

<body class="bg-bg antialiased min-h-screen flex flex-col justify-between selection:bg-primary selection:text-bg">
    <header class="sticky top-0 z-50 w-full bg-bg/85 backdrop-blur-md border-b border-muted/15 font-mono text-ink">
        <div class="max-w-5xl mx-auto flex justify-between items-center py-4 px-5 md:py-5 md:px-5 text-xs md:text-base">
            <a href="{% url 'main:show_main' %}" class="text-primary">~/Nabila</a>
            <nav class="text-muted">
                <a href="{% url 'main:show_main' %}">
                    /<span class="{% if request.resolver_match.url_name == 'show_main' %}text-primary{% else %}hover:text-primary{% endif %}">profile</span>
                </a>
                <a href="{% url 'main:show_experience' %}">
                    /<span class="{% if request.resolver_match.url_name == 'show_experience' %}text-primary{% else %}hover:text-primary{% endif %}">experience</span>
                </a>
                <a href="{% url 'main:show_skill' %}">
                    /<span class="{% if request.resolver_match.url_name == 'show_skill' %}text-primary{% else %}hover:text-primary{% endif %}">skill</span>
                </a>
                <a href="{% url 'main:show_project' %}">
                    /<span class="{% if request.resolver_match.url_name == 'show_project' %}text-primary{% else %}hover:text-primary{% endif %}">project</span>
                </a>
            </nav>
        </div>
    </header>
    <main class="max-w-5xl mx-auto w-full px-7 py-7 md:px-5">
    {% block content %} {% endblock content %}
</main>

    <footer class="w-full border-t border-muted/15 bg-background py-8 font-mono text-xs text-muted">
        <div class="max-w-5xl mx-auto px-5 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex flex-col md:flex-row items-center gap-1 md:gap-2 text-center md:text-left">
                <span class="text-ink font-semibold">&copy; 2026 {{ first_name }} {{ middle_name }} {{ last_name }}</span>
                <span class="hidden md:inline text-muted/40">•</span>
                <span>Fakultas Ilmu Komputer, Universitas Indonesia</span>
            </div>

            <div class="flex items-center gap-2 bg-surface px-3 py-1.5 rounded border border-muted/20 text-[11px]">
                <span class="relative flex h-2 w-2">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded bg-primary opacity-75"></span>
                    <span class="relative inline-flex rounded h-2 w-2 bg-primary"></span>
                </span>
                <span class="text-ink">Built with patience</span>
            </div>
        </div>
    </footer>
</body>


</html>
